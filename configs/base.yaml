seed: 42
seeds: [42]
target: PM2.5
horizons: [1, 6, 24]
stations: all
raw_directory: datasets/raw
threads: 4
timezone_assumption: Asia/Shanghai
lags: [1, 3, 6, 12, 24]
windows: [3, 6, 12, 24]
minimum_observed_fraction: 0.75
forward_fill_limit_hours: 3
train_start: '2013-03-01'
validation_start: '2015-09-01'
test_start: '2016-03-01'
test_end_exclusive: '2017-03-01'
cv_folds:
  - ['2014-09-01', '2015-01-01']
  - ['2015-01-01', '2015-05-01']
  - ['2015-05-01', '2015-09-01']
models: [B0, B1, B2, B3, M1, M2, M3, H0, H1]
ablations: true
ridge_alpha: 1.0
feature_selection:
  spearman_threshold: 0.95
  top_k: 40
  mutual_info_neighbors: 5
  mi_max_samples: null
regime:
  n_clusters: 4
  n_init: 10
  batch_size: 2048
regressor:
  type: HistGradientBoostingRegressor
  loss: squared_error
  learning_rate: 0.05
  max_iter: 300
  max_leaf_nodes: 31
  min_samples_leaf: 30
  l2_regularization: 1.0
  early_stopping: false
search:
  n_trials: 8
  top_k: [20, 40, 60]
  clusters: [3, 4, 5]
  ridge_alpha: [0.1, 1.0, 10.0, 100.0]
  regressor:
    max_iter: [200, 400]
    max_leaf_nodes: [15, 31]
    min_samples_leaf: [20, 50]
    l2_regularization: [0.0, 1.0, 10.0]
